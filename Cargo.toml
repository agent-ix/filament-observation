[package]
name = "filament-observation"
version = "0.1.1"
edition = "2021"
rust-version = "1.98"
license = "AGPL-3.0-or-later"
publish = false
description = "Qualified observation bindings and transport-independent valuations for Filament."
repository = "https://github.com/agent-ix/filament-observation"

[lib]
name = "filament_observation"
path = "src/lib.rs"

[workspace]
members = ["."]
resolver = "2"

[features]
# Exports owned test fixtures for downstream test code. Never enabled by default.
test-support = []

[dependencies]
quire-canonical = { version = "=0.3.1", git = "https://github.com/agent-ix/quire-canonical", tag = "v0.3.1", features = ["serde_json"] }
filament-exact = { git = "https://github.com/agent-ix/filament-exact", rev = "b26a8e4c592503fccdc4a0e3d2cce23dd8487616", features = ["json"] }
filament-semantic-value = { git = "https://github.com/agent-ix/filament-semantic-value", rev = "f5c913bd4fc8880b45e02e3918e02360c530320c" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["raw_value"] }
sha2 = "=0.10.9"
thiserror = "=2.0.20"

[dev-dependencies]
allocation-counter = "0.8.1"
ix-trace-rs = { version = "=0.1.2", git = "https://github.com/agent-ix/ix-trace-rs", tag = "v0.1.2" }
jsonschema = { version = "=0.56.0", default-features = false }
proptest = "=1.11.0"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = "deny"
